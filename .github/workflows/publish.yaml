name: publish

# Push a tag such as v0.1.0 (matching "version" in package.json) to publish that version to npm.
#
# Publishing uses npm trusted publishing (OIDC) when the package is set up for it on npmjs.com:
# Settings → Trusted publishing → GitHub Actions, repository ZharfAI/zharf-js, workflow
# publish.yaml. Until then, add an automation token as the NPM_TOKEN repository secret; npm uses
# it when there is no trusted publisher. Either way the package gets a provenance statement.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.5.1
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
